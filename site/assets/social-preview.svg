<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Project social preview">
  <title>{{brand.name}} — {{brand.promise}}</title>
  <defs>
    <style>
      /* Relative to this file's own location in the built site, so the card renders in the
         display face wherever it is rasterised from. Every rule still ends in a system stack:
         a preview that cannot reach the font must fall back, never fail to draw. */
      @font-face {
        font-family: 'Bricolage Grotesque';
        src: url('fonts/bricolage-grotesque-latin-var.woff2') format('woff2-variations');
        font-weight: 400 800;
      }
      @font-face {
        font-family: 'Spline Sans Mono';
        src: url('fonts/spline-sans-mono-latin-var.woff2') format('woff2-variations');
        font-weight: 400 700;
      }
      .h { font-family: 'Bricolage Grotesque', 'Avenir Next', Avenir, system-ui, sans-serif; font-weight: 800; letter-spacing: -1.4px; }
      .m { font-family: 'Spline Sans Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s { font-family: 'Bricolage Grotesque', 'Avenir Next', Avenir, system-ui, sans-serif; font-weight: 500; }
      .k { font-family: 'Spline Sans Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; letter-spacing: 3.4px; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#f7f3e9" />

  <!-- The Accord Seal, large and quiet in the corner: the mark should be recognisable
       here before the wordmark is read. -->
  <g transform="translate(1074, 96) scale(1.72)" opacity="0.92">
    <circle cx="60" cy="60" r="44" fill="none" stroke="{{flow.agent}}" stroke-width="7" stroke-linecap="round" stroke-dasharray="58 218.5" />
    <circle cx="60" cy="60" r="44" fill="none" stroke="{{flow.policy}}" stroke-width="7" stroke-linecap="round" stroke-dasharray="58 218.5" transform="rotate(90 60 60)" />
    <circle cx="60" cy="60" r="44" fill="none" stroke="{{flow.human}}" stroke-width="7" stroke-linecap="round" stroke-dasharray="58 218.5" transform="rotate(180 60 60)" />
    <circle cx="60" cy="60" r="44" fill="none" stroke="{{flow.evidence}}" stroke-width="7" stroke-linecap="round" stroke-dasharray="58 218.5" transform="rotate(270 60 60)" />
    <circle cx="60" cy="60" r="11" fill="{{flow.accord}}" />
  </g>

  <!-- wordmark -->
  <g transform="translate(88, 66) scale(0.30)">
    <circle cx="60" cy="60" r="44" fill="none" stroke="{{flow.agent}}" stroke-width="14" stroke-linecap="round" stroke-dasharray="54 222.5" />
    <circle cx="60" cy="60" r="44" fill="none" stroke="{{flow.policy}}" stroke-width="14" stroke-linecap="round" stroke-dasharray="54 222.5" transform="rotate(90 60 60)" />
    <circle cx="60" cy="60" r="44" fill="none" stroke="{{flow.human}}" stroke-width="14" stroke-linecap="round" stroke-dasharray="54 222.5" transform="rotate(180 60 60)" />
    <circle cx="60" cy="60" r="44" fill="none" stroke="{{flow.evidence}}" stroke-width="14" stroke-linecap="round" stroke-dasharray="54 222.5" transform="rotate(270 60 60)" />
    <circle cx="60" cy="60" r="15" fill="{{flow.accord}}" />
  </g>
  <text class="k" x="132" y="99" font-size="15" fill="#171912">{{brand.name}}</text>

  <!-- headline -->
  <text class="h" x="88" y="252" font-size="60" fill="#171912">Your business is different.</text>
  <text class="h" x="88" y="322" font-size="60" fill="{{flow.agent}}">Your CRM should be too.</text>

  <!-- subhead -->
  <text class="s" x="88" y="392" font-size="23" fill="#62655b">Tell your coding agent how you sell and serve customers.</text>
  <text class="s" x="88" y="426" font-size="23" fill="#62655b">{{brand.name}} gives it the rules. You keep the code.</text>

  <!-- The one decision, drawn: the agent proposes, policy stops it, a human decides,
       evidence stays behind. Same line, same colours, same order as the homepage. -->
  <g transform="translate(88, 520)">
    <rect x="0" y="27" width="1104" height="2" fill="#ddd8c8" />
    <rect x="0" y="27" width="742" height="2" fill="{{flow.accord}}" />

    <circle cx="0" cy="28" r="6" fill="{{flow.agent}}" />
    <text class="m" x="-2" y="14" font-size="13" font-weight="700" fill="#4c2fc5">AGENT PROPOSES</text>

    <rect x="298" y="10" width="4" height="36" rx="2" fill="{{flow.policy}}" />
    <text class="m" x="288" y="-2" font-size="13" font-weight="700" fill="#665000">POLICY STOPS</text>

    <circle cx="600" cy="28" r="6" fill="{{flow.human}}" />
    <text class="m" x="590" y="14" font-size="13" font-weight="700" fill="#9b292d">HUMAN DECIDES</text>

    <circle cx="900" cy="28" r="6" fill="{{flow.evidence}}" />
    <text class="m" x="890" y="14" font-size="13" font-weight="700" fill="#00677a">AUDIT RECORDED</text>

    <text class="m" x="0" y="72" font-size="14" fill="#6f6a5a">{{measured.tests}} tests · 0 runtime dependencies · MIT · measured at {{measured.sha}}</text>
  </g>
</svg>
