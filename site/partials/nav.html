      <!--
        The same eight destinations twice, and deliberately so. This site runs no executable
        script — its Content-Security-Policy in vercel.json is `default-src 'none'` with no
        `script-src` at all — so a menu cannot be toggled by script, and a details/summary
        disclosure is the only mechanism a browser gives us without one. A single
        list that is a bar on desktop and a disclosure on a phone would require author CSS to
        override the closed state of `details`, which newer engines hide with `content-visibility`
        rather than `display`. Two lists, one hidden per breakpoint, work in every engine and
        leave exactly one of them in the accessibility tree at a time.
