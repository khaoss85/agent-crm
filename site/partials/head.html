  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="{{meta.robots}}" />
  <!--
    Indexing follows the repository's visibility, from site/brand.json — not a
    hand-edited tag. While the source is private every link into it 404s for a
    stranger, and teaching an answer engine a page whose primary link is broken
    is expensive to undo. This flips to index,follow in the same edit that makes
    the repository public.
  -->
  <link rel="stylesheet" href="{{page.root}}styles.css" />
  <!--
    Both faces are served from this origin, so the CSP stays `font-src 'self'`
    and no page reaches a third party to render its own headline. They are
    preloaded because @font-face inside the stylesheet is discovered a round
    trip late, and the display face sets the first line a visitor reads.
  -->
  <link rel="preload" href="{{page.root}}fonts/bricolage-grotesque-latin-var.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  <link rel="preload" href="{{page.root}}fonts/spline-sans-mono-latin-var.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  <link rel="icon" href="{{page.root}}mark.svg" type="image/svg+xml" />
  <!-- The page's own ground, so the browser chrome on a phone continues the paper rather than
       tinting itself the Admin's green. -->
  <meta name="theme-color" content="{{site.paper}}" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#10120e" media="(prefers-color-scheme: dark)" />
