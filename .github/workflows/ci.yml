name: CI

on:
  push:
  pull_request:

# Both jobs read the Node version from `.nvmrc` rather than pinning it inline.
#
# `package.json` `engines` stays the **floor** — ">=22.16.0" is the oldest runtime this
# framework supports, and lowering the bar in CI would not change that. `.nvmrc` is the
# separate question of which exact runtime CI and a local developer agree to run, and the
# two had drifted: CI pinned 22.16.0 while local shells were on 22.22, which is a gap wide
# enough to hide a real defect through ten consecutive green local runs — it did, in the
# first wave of this milestone. One file, read by `nvm`, by `actions/setup-node` and by a
# human, is how the two stay the same number.
jobs:
  # Left at the default fetch-depth: 1 deliberately. Nothing under `npm run verify` or
  # `npm run smoke` reads git history — the only git these run is `ls-files`, `status`
  # and `diff HEAD`, all of which work in a one-commit checkout, and the provenance
  # tests build their own fixture repositories rather than reading this one.
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: accordo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCORDO_TEST_POSTGRES: '1'
      ACCORDO_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/accordo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run smoke

  # Public claims are held to the same standard as the code that backs them:
  # a marketing sentence whose evidence has moved fails the build, exactly like a
  # test would. See scripts/site-check.js and scripts/distribution-check.js.
  public-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The one job that reads history, because it is the one job that checks a
          # historical fact. site/claims.json records the commit its public numbers were
          # measured at, and scripts/measurement.js has to show that commit is an
          # ancestor of HEAD — object existence is not provenance; a commit pushed to an
          # unrelated branch has that too.
          #
          # `git merge-base --is-ancestor` needs the commits *between* the two, not just
          # the named one, so a targeted `git fetch origin <sha>` does not help: it hands
          # back an object with no path to HEAD and the check still cannot answer. Full
          # history is the smallest thing that answers the question, and it is cheap here
          # — the pack is under 3 MB.
          #
          # Without this, the default fetch-depth: 1 leaves no commit but HEAD, and every
          # honest historical measurement is reported as "not a commit in this
          # repository". That is what was failing PRs #43, #44 and #45. Removing it does
          # not silently re-break them: the gate now recognises a shallow clone and fails
          # with "history unavailable" instead.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run gtm:check
      # The Repository Truth Contract (ADR-039) belongs in this job and in no
      # other. Its measurement provenance checks need full git history, and this
      # is the one job that has it — which is also why it cannot go in `verify`,
      # deliberately left at `fetch-depth: 1`.
      #
      # It shipped wired into nothing: a contract written because the failure it
      # closes was "found by a person, not by a gate" was itself waiting on a
      # person to remember to type the command. A separate step rather than a
      # member of `gtm:check`, so the composition of `gtm:check` — which a
      # developer runs locally in a possibly shallow clone — is unchanged. It
      # takes about half a second.
      - run: npm run repo:truth -- --check
