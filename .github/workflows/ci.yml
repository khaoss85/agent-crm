name: CI

on:
  push:
    branches: [main]
  pull_request:

# One self-hosted runner serves this repository: a push to a PR branch used to
# start two identical runs (the `push` event and the `pull_request` event) and
# the second queued behind the first for the whole suite. Keying the group on
# `github.ref` did not fix it: push carries refs/heads/* while pull_request
# carries refs/pull/*/merge, so the two groups never matched and
# cancel-in-progress never fired across them. The PR number unites both events
# of the same PR (and `push` is limited to main, so a branch push runs once,
# through the pull_request event). One run per PR, always the newest; a
# superseded run is cancelled, never queued.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# All jobs read the Node version from `.nvmrc` rather than pinning it inline.
#
# `package.json` `engines` stays the **floor** — ">=22.16.0" is the oldest runtime this
# framework supports, and lowering the bar in CI would not change that. `.nvmrc` is the
# separate question of which exact runtime CI and a local developer agree to run, and the
# two had drifted: CI pinned 22.16.0 while local shells were on 22.22, which is a gap wide
# enough to hide a real defect through ten consecutive green local runs — it did, in the
# first wave of this milestone. One file, read by `nvm`, by `actions/setup-node` and by a
# human, is how the two stay the same number.
jobs:
  # The PR gate. `push` is limited to `main` above, so this is every change
  # that is not yet merged: `npm run check`, the tests of the touched files
  # (`scripts/ci-touched-tests.js`), the smoke demo, the published recipe
  # replay and the agreement gates (`gtm:check`, `repo:truth -- --check`
  # without `--require-current`). Every suite step runs under the machine lock
  # via `scripts/ci-heavy.sh`, each under five minutes, under ten minutes of
  # lock held in total — the full `npm test` holds it ~20 minutes
  # (CI run 38983644969), so it runs only on `main` (job `verify`
  # below), not on every PR push.
  fast:
    if: github.event_name == 'pull_request'
    # Same billing-lock routing as `verify` below.
    runs-on: [self-hosted, accordo-ci]
    env:
      ACCORDO_TEST_POSTGRES: '1'
      ACCORDO_PG_TEST_URL: postgres://postgres@127.0.0.1:5432/accordo_test
    steps:
      # Full history: the touched-file selection diffs against the PR base,
      # and the truth agreement check reads history like `public-claims` does.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fetch the PR base for touched-file selection
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"
      - name: Start PostgreSQL 16 (self-hosted macOS)
        if: runner.os == 'macOS'
        run: |
          brew services start postgresql@16
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5432 && break; sleep 2; done
          pg_isready -h 127.0.0.1 -p 5432
          psql -h /tmp -d postgres -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres SUPERUSER LOGIN; END IF; END \$\$;"
          psql -h /tmp -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'accordo_test'" | grep -q 1 || psql -h /tmp -d postgres -c "CREATE DATABASE accordo_test OWNER postgres;"
      - name: Start PostgreSQL 16 (GitHub-hosted Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name accordo-pg -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_USER=postgres -e POSTGRES_DB=accordo_test -p 5432:5432 postgres:16
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5432 -U postgres && break; sleep 2; done
      - run: npm ci
      # Every heavy PR step below enforces the §7 five-minute budget itself:
      # HEAVY_JOB_MAX_SEC=300 fails the step red instead of holding the
      # shared lock past the budget and queueing Arvo behind it. (`main`'s
      # measure step keeps the wrapper default: the full suite needs it.)
      - name: Syntax check every JavaScript file
        run: HEAVY_JOB_MAX_SEC=300 scripts/ci-heavy.sh check -- npm run check
      - name: Tests of the touched files
        run: HEAVY_JOB_MAX_SEC=300 scripts/ci-heavy.sh touched -- node scripts/ci-touched-tests.js --base FETCH_HEAD
      - name: Smoke demo
        run: HEAVY_JOB_MAX_SEC=300 scripts/ci-heavy.sh smoke -- npm run smoke
      - name: Replay the published quote approval recipe
        run: |
          HEAVY_JOB_MAX_SEC=300 scripts/ci-heavy.sh recipe -- bash -c 'node --no-warnings examples/recipes/quote-approval/run.mjs "$RUNNER_TEMP/quote-approval-crm" && npm --prefix "$RUNNER_TEMP/quote-approval-crm" run verify'
      - name: Public claims and packaging agree
        run: HEAVY_JOB_MAX_SEC=300 scripts/ci-heavy.sh gtm -- npm run gtm:check
      # Agreement only: the committed truth document must equal a fresh
      # generation from the PR's own inputs (TRUTH_DOCUMENT_STALE otherwise).
      # Freshness against a new measurement (`--require-current`) needs the
      # full suite, so it runs only on `main` in `public-claims` below.
      - name: The committed truth document agrees with its authorities
        run: HEAVY_JOB_MAX_SEC=300 scripts/ci-heavy.sh truth -- npm run repo:truth -- --check

  # Left at the default fetch-depth: 1 deliberately. Nothing under `npm run verify` or
  # `npm run smoke` reads git history — the only git these run is `ls-files`, `status`
  # and `diff HEAD`, all of which work in a one-commit checkout, and the provenance
  # tests build their own fixture repositories rather than reading this one.
  verify:
    # The full suite with its measurement runs only on `main`: on a PR it
    # would hold the shared Mac's single heavy lock ~25 minutes per push,
    # queueing Arvo's releases behind it. (What runs where is §7 of
    # docs/QUALITY_GATES.md.) A red measurement here keeps `main` red: the
    # step below has no `continue-on-error`, and `public-claims` refuses a
    # missing measurement instead of going quiet.
    if: github.event_name == 'push'
    # Self-hosted while the account billing lock rejects every GitHub-hosted
    # job at start (0 steps, "account is locked due to a billing issue").
    # Switch back to ubuntu-latest once billing is unlocked.
    runs-on: [self-hosted, accordo-ci]
    env:
      ACCORDO_TEST_POSTGRES: '1'
      ACCORDO_PG_TEST_URL: postgres://postgres@127.0.0.1:5432/accordo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Start PostgreSQL 16 (self-hosted macOS)
        if: runner.os == 'macOS'
        run: |
          brew services start postgresql@16
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5432 && break; sleep 2; done
          pg_isready -h 127.0.0.1 -p 5432
          psql -h /tmp -d postgres -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres SUPERUSER LOGIN; END IF; END \$\$;"
          psql -h /tmp -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'accordo_test'" | grep -q 1 || psql -h /tmp -d postgres -c "CREATE DATABASE accordo_test OWNER postgres;"
      - name: Start PostgreSQL 16 (GitHub-hosted Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name accordo-pg -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_USER=postgres -e POSTGRES_DB=accordo_test -p 5432:5432 postgres:16
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5432 -U postgres && break; sleep 2; done
      - name: Install and verify PostgreSQL 16 backup client (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 16\.'
          pg_restore --version | grep -E '^pg_restore \(PostgreSQL\) 16\.'
          psql --version | grep -E '^psql \(PostgreSQL\) 16\.'
      - name: Verify PostgreSQL 16 backup client (macOS)
        if: runner.os == 'macOS'
        run: |
          pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 16\.'
          pg_restore --version | grep -E '^pg_restore \(PostgreSQL\) 16\.'
          psql --version | grep -E '^psql \(PostgreSQL\) 16\.'
      - run: npm ci
      # The measurement script executes npm run verify itself on this clean
      # checkout. Reuse that run instead of maintaining an unmeasured suite and
      # asking a maintainer to run it again on a different machine.
      - name: Verify and emit the measured claim record
        run: scripts/ci-heavy.sh measure -- node scripts/measure-suite.js > "$RUNNER_TEMP/measurement.json"
      # The account's artifact storage can be full (the billing lock also stops the
      # quota from being freed), and both jobs run on the same self-hosted runner, so
      # the record is also kept on the runner. Keyed by this run and attempt, never by
      # commit: a re-run of a commit whose verify failed must not find the record an
      # earlier green run left behind.
      - name: Keep the measurement on the runner for public-claims
        run: |
          mkdir -p "$HOME/.accordo-ci/measurements"
          cp "$RUNNER_TEMP/measurement.json" "$HOME/.accordo-ci/measurements/${{ github.run_id }}-${{ github.run_attempt }}.json"
      - run: scripts/ci-heavy.sh smoke -- npm run smoke
      - name: Replay the published quote approval recipe
        run: |
          scripts/ci-heavy.sh recipe -- bash -c 'node --no-warnings examples/recipes/quote-approval/run.mjs "$RUNNER_TEMP/quote-approval-crm" && npm --prefix "$RUNNER_TEMP/quote-approval-crm" run verify'
      - uses: actions/upload-artifact@v4
        # Best effort: the runner-local copy above is what public-claims falls back to.
        continue-on-error: true
        with:
          name: claims-measurement-${{ github.sha }}
          path: ${{ runner.temp }}/measurement.json
          if-no-files-found: error
          retention-days: 30

  # Public claims are held to the same standard as the code that backs them:
  # a marketing sentence whose evidence has moved fails the build, exactly like a
  # test would. See scripts/site-check.js and scripts/distribution-check.js.
  public-claims:
    # Same billing-lock routing as `verify` above.
    runs-on: [self-hosted, accordo-ci]
    # The measurement this job checks is the one `verify` just produced on
    # this same tree (same workflow run, same checkout ref): no local
    # `measure-suite --apply` commit is needed for a PR to go green
    # (backlog:98cb04b959e6). `needs` orders the two jobs; `!cancelled()`
    # keeps the ordering without silencing a failure — a `needs` alone would
    # SKIP this job when `verify` fails, and a skipped gate reads as quiet.
    # Running unless cancelled means a missing or failed measurement fails
    # this job red instead: the download finds no artifact and refuses.
    # Freshness against a new measurement (`--require-current`) needs the full
    # suite, so like `verify` this runs only on `main`: a PR proves agreement
    # in `fast` and is re-measured at merge time here.
    needs: [verify]
    if: ${{ github.event_name == 'push' && !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The one job that reads history, because it is the one job that checks a
          # historical fact. site/claims.json records the commit its public numbers were
          # measured at, and scripts/measurement.js has to show that commit is an
          # ancestor of HEAD — object existence is not provenance; a commit pushed to an
          # unrelated branch has that too.
          #
          # `git merge-base --is-ancestor` needs the commits *between* the two, not just
          # the named one, so a targeted `git fetch origin <sha>` does not help: it hands
          # back an object with no path to HEAD and the check still cannot answer. Full
          # history is the smallest thing that answers the question, and it is cheap here
          # — the pack is under 3 MB.
          #
          # Without this, the default fetch-depth: 1 leaves no commit but HEAD, and every
          # honest historical measurement is reported as "not a commit in this
          # repository". That is what was failing PRs #43, #44 and #45. Removing it does
          # not silently re-break them: the gate now recognises a shallow clone and fails
          # with "history unavailable" instead.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run gtm:check
      # The Repository Truth Contract (ADR-039) belongs in this job and in no
      # other. Its measurement provenance checks need full git history, and this
      # is the one job that has it — which is also why it cannot go in `verify`,
      # deliberately left at `fetch-depth: 1`.
      #
      # It shipped wired into nothing: a contract written because the failure it
      # closes was "found by a person, not by a gate" was itself waiting on a
      # person to remember to type the command. A separate step rather than a
      # member of `gtm:check`, so the composition of `gtm:check` — which a
      # developer runs locally in a possibly shallow clone — is unchanged. It
      # takes about half a second.
      #
      # Before this step the ledger still names the last locally measured
      # commit, so any PR that moved `tests/` would fail below until somebody
      # re-ran the suite on a Mac. Instead the job takes the measurement
      # `verify` just produced on this exact tree: the artifact is missing
      # exactly when `verify` failed or never measured, and the download
      # refuses in that case — a missing measurement fails red, never quiet.
      # `apply-ci-measurement.js` binds the record to this checkout (HEAD,
      # `HEAD:tests`, clean tree, green run) before writing anything.
      # Gate 1 on the committed document, before anything is regenerated: the
      # document the PR commits must equal a fresh generation from the PR's own
      # inputs (TRUTH_DOCUMENT_STALE otherwise). Only the measurement re-anchor
      # below is CI's to do; every other fact stays the author's to regenerate.
      - name: The committed truth document agrees with its authorities
        run: npm run repo:truth -- --check
      - name: Take the measurement verify just produced on this tree
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: claims-measurement-${{ github.sha }}
          path: ${{ runner.temp }}/ci-measurement
      # The artifact is missing when storage is full; the runner-local copy written by
      # `verify` for this same commit stands in. Neither present means verify never
      # measured this tree, and the job fails red here.
      - name: Fall back to the runner-local measurement
        run: |
          dest="${{ runner.temp }}/ci-measurement/measurement.json"
          if [ ! -s "$dest" ]; then
            src="$HOME/.accordo-ci/measurements/${{ github.run_id }}-${{ github.run_attempt }}.json"
            [ -s "$src" ] || { echo "no CI measurement from this run (${{ github.run_id }}-${{ github.run_attempt }}): neither artifact nor runner copy" >&2; exit 1; }
            mkdir -p "$(dirname "$dest")" && cp "$src" "$dest"
          fi
      - name: Re-anchor the ledger at the CI measurement
        run: node scripts/apply-ci-measurement.js "${{ runner.temp }}/ci-measurement/measurement.json"
      # The committed document was checked as committed above. Its measurement
      # facts still name the last measured tree, so it is regenerated here from
      # the re-anchored ledger for the freshness check below only. Authors still
      # regenerate and commit it for every other fact they move (QUALITY_GATES
      # s6.1); what they no longer do is re-measure the suite on a Mac.
      - run: npm run repo:truth
      # `--require-current` holds the freshness ratio at 1: any fact whose
      # status is not `current` (a measurement that no longer describes this
      # tree) fails this job, exactly like a test would. A local `--check`
      # without the flag still guards agreement only.
      - run: npm run repo:truth -- --check --require-current
