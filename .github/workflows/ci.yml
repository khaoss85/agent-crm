name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The full measurement runs on this schedule — the configured window
  # (backlog:911355123044). A push to `main` never starts `measure-suite.js`:
  # the full suite with its measurement runs in short pieces, each under its
  # own heavy-lock acquisition (backlog:9fff957f3968), and one runner serves
  # this repository plus Arvo, so merge bursts used to queue one full measure
  # per merge ahead of the fast PR gates. At most one scheduled run measures
  # per window (see the `verify` job's head-changed guard), and
  # `workflow_dispatch` measures on demand. Keep `MEASURE_WINDOW_HOURS` in
  # `scripts/ci-measurement-age.js` equal to the longest gap below.
  # Night windows only (22:23 and 02:23 UTC): the machine is shared and Arvo
  # has precedence by day; a daytime run held the heavy lock for over 30
  # minutes on 2026-10-22 and queued Arvo's release behind it.
  schedule:
    - cron: '23 22,2 * * *'
  workflow_dispatch:

# One self-hosted runner serves this repository: a push to a PR branch used to
# start two identical runs (the `push` event and the `pull_request` event) and
# the second queued behind the first for the whole suite. Keying the group on
# `github.ref` did not fix it: push carries refs/heads/* while pull_request
# carries refs/pull/*/merge, so the two groups never matched and
# cancel-in-progress never fired across them. The PR number unites both events
# of the same PR (and `push` is limited to main, so a branch push runs once,
# through the pull_request event).
#
# Concurrency lives on the jobs, not on the workflow, so the three lanes can
# supersede within their own lane without cancelling each other: a push to
# `main` must never cancel a measurement already running (nor queue behind
# it), and a newer scheduled window supersedes a still-waiting older one
# instead of queueing a second 25-minute run behind it.

# All jobs read the Node version from `.nvmrc` rather than pinning it inline.
#
# `package.json` `engines` stays the **floor** — ">=22.16.0" is the oldest runtime this
# framework supports, and lowering the bar in CI would not change that. `.nvmrc` is the
# separate question of which exact runtime CI and a local developer agree to run, and the
# two had drifted: CI pinned 22.16.0 while local shells were on 22.22, which is a gap wide
# enough to hide a real defect through ten consecutive green local runs — it did, in the
# first wave of this milestone. One file, read by `nvm`, by `actions/setup-node` and by a
# human, is how the two stay the same number.
jobs:
  # The PR gate. `push` is limited to `main` above, so this is every change
  # that is not yet merged: `npm run check`, the tests of the touched files
  # (`scripts/ci-touched-tests.js`), the smoke demo, the published recipe
  # replay, the agreement gates (`gtm:check`, `repo:truth -- --check`
  # without `--require-current`), the verifier-fixture drift check and the
  # checked-in plan-pin currency check. All
  # eight phases run under ONE machine lock
  # via `scripts/ci-fast.sh`, capped below ten minutes in total by the
  # wrapper (HEAVY_JOB_MAX_SEC=540 kills the run past nine minutes): a PR
  # holds the shared lock less than ten minutes in total, enforced, not an
  # objective — measured ~290 s on CI run 39124350674, about half the
  # budget. The full
  # `npm test` holds it ~20 minutes (CI run 38983644969), so it runs only
  # on `main` (job `verify` below), not on every PR push.
  fast:
    if: github.event_name == 'pull_request'
    # One run per PR, always the newest; a superseded run is cancelled, never
    # queued. (Was the workflow-level group; moved here so `main` lanes keep
    # their own groups — see the concurrency note above.)
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Same billing-lock routing as `verify` below.
    runs-on: [self-hosted, accordo-ci]
    env:
      ACCORDO_TEST_POSTGRES: '1'
      # ACCORDO_PG_TEST_URL is set by the PostgreSQL start step below: one
      # cluster per runner, on the port the runner's .env names (ACCORDO_PG_PORT).
    steps:
      # Full history: the touched-file selection diffs against the PR base,
      # and the truth agreement check reads history like `public-claims` does.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fetch the PR base for touched-file selection
        env:
          BASE_REF: ${{ github.base_ref }}
        # Into its tracking ref, not just FETCH_HEAD: the truth agreement
        # check reads the base's committed document from it (`--base` below).
        run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
      - name: Start PostgreSQL 16 (self-hosted macOS)
        if: runner.os == 'macOS'
        run: |
          brew services start postgresql@16
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5432 && break; sleep 2; done
          pg_isready -h 127.0.0.1 -p 5432
          echo "ACCORDO_PG_TEST_URL=postgres://postgres@127.0.0.1:5432/accordo_test" >> "$GITHUB_ENV"
          psql -h /tmp -d postgres -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres SUPERUSER LOGIN; END IF; END \$\$;"
          psql -h /tmp -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'accordo_test'" | grep -q 1 || psql -h /tmp -d postgres -c "CREATE DATABASE accordo_test OWNER postgres;"
      - name: Start PostgreSQL 16 (GitHub-hosted Linux)
        if: runner.os == 'Linux'
        run: |
          # Two runners can share the Linux server: each names its own
          # container and port in its .env (ACCORDO_PG_NAME, ACCORDO_PG_PORT).
          # Loopback only: the cluster trusts every connection. A container a
          # cancelled run left behind would refuse the name: removed first.
          docker rm -f "${ACCORDO_PG_NAME:-accordo-pg}" >/dev/null 2>&1 || true
          docker run -d --name "${ACCORDO_PG_NAME:-accordo-pg}" -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_USER=postgres -e POSTGRES_DB=accordo_test -p "127.0.0.1:${ACCORDO_PG_PORT:-5432}:5432" postgres:16
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p "${ACCORDO_PG_PORT:-5432}" -U postgres && break; sleep 2; done
          echo "ACCORDO_PG_TEST_URL=postgres://postgres@127.0.0.1:${ACCORDO_PG_PORT:-5432}/accordo_test" >> "$GITHUB_ENV"
      - run: npm ci
      # The whole gate behind one lock: `scripts/ci-fast.sh` runs the eight
      # phases sequentially (check, touched tests, smoke, recipe replay,
      # gtm:check, truth agreement, verifier-fixture drift, plan-pin currency) under a single heavy-job acquisition,
      # and HEAVY_JOB_MAX_SEC=540 fails the step red past nine minutes of
      # lock instead of queueing Arvo behind it. (`main`'s measure step
      # keeps the wrapper default: the full suite needs it.) Each phase
      # keeps its `::group::` log section and prints its own elapsed time;
      # the script prints the total on success.
      #
      # Agreement only: the committed truth document must equal a fresh
      # generation from the PR's own inputs — with one exception (S70,
      # backlog:6a3d0316): drift that moves no fact value and drops no fact
      # only warns under `--drift-advisory`, and an added fact warns only
      # when the base already carries it (`--base`). Parallel PRs stay green
      # after the first merges with no regen round-trip; a value — or a fact
      # — this PR itself changed without regenerating still fails, and `main`
      # realigns after merge through a normal-gated PR (`public-claims`
      # below). Freshness against a new measurement (`--require-current`)
      # needs the full suite, so it runs only on `main`.
      - name: PR gate under one machine lock (check, touched, smoke, recipe, gtm, truth)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: HEAVY_JOB_MAX_SEC=540 scripts/ci-heavy.sh fast -- bash scripts/ci-fast.sh

  # Full history here, not the default fetch-depth: 1. The measure itself needs
  # no history, but the re-anchor binds the record with ancestor checks and
  # the realign step works branches — both moved here with the measurement
  # (backlog:911355123044). The pack is under 3 MB, so this stays cheap.
  verify:
    # The full suite with its measurement runs on `main` on a schedule — the
    # configured window — plus manual dispatch of `main`, never on `push`
    # (backlog:911355123044): on a push it would hold the shared Mac's single
    # heavy lock ~25 minutes per merge, queueing Arvo's releases and the fast
    # PR gates behind it. (What runs where is §7 of docs/QUALITY_GATES.md.)
    # A red measurement here keeps `main` red: the measure step below has no
    # `continue-on-error`, and the re-anchor refuses a missing measurement
    # instead of going quiet. The dispatch half is `main`-only: a manual run
    # aimed at a feature branch must not reach the realign step, which rebases
    # the fixed `chore/truth-realign-main` branch and opens a PR to `main`.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # At most one scheduled measurement alive: a newer window supersedes a
    # still-waiting older one instead of queueing a second 25-minute run. A
    # push to `main` is a different group and never cancels this job.
    concurrency:
      group: ci-main-measure
      cancel-in-progress: true
    # Self-hosted while the account billing lock rejects every GitHub-hosted
    # job at start (0 steps, "account is locked due to a billing issue").
    # Switch back to ubuntu-latest once billing is unlocked.
    runs-on: [self-hosted, accordo-ci]
    env:
      ACCORDO_TEST_POSTGRES: '1'
      # ACCORDO_PG_TEST_URL is set by the PostgreSQL start step below: one
      # cluster per runner, on the port the runner's .env names (ACCORDO_PG_PORT).
      # The shell-classifier oracle runs its complete 26,880-cell cross-product
      # (plus the heredoc delimiter corpus) here; the default local run
      # covers a documented 10,080-cell subset plus a 120-cell heredoc sample,
      # so `npm test` finishes in minutes on a developer machine.
      # See tests/helpers/shell-oracle.js (sliced across
      # tests/shell-oracle-a/b/c/d/e/f.test.js).
      ACCORDO_FULL_SHELL_ORACLE: '1'
      # No ACCORDO_ORACLE_DRIVER here on purpose: the measurement forces the
      # driver on for every piece it runs (scripts/measure-suite.js), so no
      # entry point can publish a record over skipped oracle tests. Direct
      # `node --test` runs (the PR gate, the pre-push hook) still run only
      # the slices' wiring. Same backlog as the slicing above.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: see the job-level comment above.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Second half of "at most once per window, and only when the head
      # changed": when the committed ledger or the runner-local record of the
      # last successful measurement already names this head, every step below
      # skips and the run ends green without touching the lock. The ledger
      # alone cannot answer (a re-anchored merge always moves HEAD past the
      # measured commit), and neither can the record alone (the same merge
      # moves HEAD past the recorded head too), so the guard additionally
      # treats a head that differs from the recorded head only in the
      # measurement-flow files as unmoved. Runs on
      # plain setup-node, before `npm ci`: the guard imports only node
      # builtins and local scripts without npm dependencies.
      # Fail-closed: only the literal guard output "false" skips, mapped by
      # scripts/ci-measure-guard-decide.sh; a crash or any unexpected output
      # measures instead of ending the run green without measuring.
      - name: Skip when HEAD is already measured
        id: guard
        run: |
          if out="$(node scripts/ci-measure-guard.js --state-file "$HOME/.accordo-ci/main-last-measurement.json")"; then
            bash scripts/ci-measure-guard-decide.sh "$out"
          else
            bash scripts/ci-measure-guard-decide.sh "guard-crashed"
          fi
      - name: Start PostgreSQL 16 (self-hosted macOS)
        if: runner.os == 'macOS' && steps.guard.outputs.measure_needed == 'true'
        run: |
          brew services start postgresql@16
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5432 && break; sleep 2; done
          pg_isready -h 127.0.0.1 -p 5432
          echo "ACCORDO_PG_TEST_URL=postgres://postgres@127.0.0.1:5432/accordo_test" >> "$GITHUB_ENV"
          psql -h /tmp -d postgres -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres SUPERUSER LOGIN; END IF; END \$\$;"
          psql -h /tmp -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'accordo_test'" | grep -q 1 || psql -h /tmp -d postgres -c "CREATE DATABASE accordo_test OWNER postgres;"
      - name: Start PostgreSQL 16 (GitHub-hosted Linux)
        if: runner.os == 'Linux' && steps.guard.outputs.measure_needed == 'true'
        run: |
          # Two runners can share the Linux server: each names its own
          # container and port in its .env (ACCORDO_PG_NAME, ACCORDO_PG_PORT).
          # Loopback only: the cluster trusts every connection. A container a
          # cancelled run left behind would refuse the name: removed first.
          docker rm -f "${ACCORDO_PG_NAME:-accordo-pg}" >/dev/null 2>&1 || true
          docker run -d --name "${ACCORDO_PG_NAME:-accordo-pg}" -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_USER=postgres -e POSTGRES_DB=accordo_test -p "127.0.0.1:${ACCORDO_PG_PORT:-5432}:5432" postgres:16
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p "${ACCORDO_PG_PORT:-5432}" -U postgres && break; sleep 2; done
          echo "ACCORDO_PG_TEST_URL=postgres://postgres@127.0.0.1:${ACCORDO_PG_PORT:-5432}/accordo_test" >> "$GITHUB_ENV"
      - name: Install and verify PostgreSQL 16 backup client (Linux)
        if: runner.os == 'Linux' && steps.guard.outputs.measure_needed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 16\.'
          pg_restore --version | grep -E '^pg_restore \(PostgreSQL\) 16\.'
          psql --version | grep -E '^psql \(PostgreSQL\) 16\.'
      - name: Verify PostgreSQL 16 backup client (macOS)
        if: runner.os == 'macOS' && steps.guard.outputs.measure_needed == 'true'
        run: |
          pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 16\.'
          pg_restore --version | grep -E '^pg_restore \(PostgreSQL\) 16\.'
          psql --version | grep -E '^psql \(PostgreSQL\) 16\.'
      - name: Install dependencies
        if: steps.guard.outputs.measure_needed == 'true'
        run: npm ci
      # The measurement runs piece by piece (`npm run measure`,
      # `scripts/measure-pieces.sh`) on this clean checkout: `npm run check`,
      # then one `measure-suite.js --shard i/n` per piece, each under its OWN
      # heavy-job acquisition with its OWN declared maximum (1800 s every
      # piece — the shell-oracle corpus is sliced one grouping per file
      # across six files, so no
      # piece needs more: backlog:9fff957f3968, backlog:664d5f481a96) — the
      # machine lock is free between two pieces,
      # and the pieces run strictly one at a time, so Arvo's heavy steps slot
      # in instead of queueing behind one ~40-minute hold or beside several
      # Accordo waiters at once.
      # No outer ci-heavy wrapper on this step: wrapping the loop would hold
      # the lock across the pieces the loop exists to release. The combine
      # runs no tests and takes no lock, and the record it prints has the
      # monolith's shape, so every step below reads it unchanged. Reuse that
      # run instead of maintaining an unmeasured suite and asking a
      # maintainer to run it again on a different machine.
      - name: Verify and emit the measured claim record
        if: steps.guard.outputs.measure_needed == 'true'
        run: bash scripts/measure-pieces.sh > "$RUNNER_TEMP/measurement.json"
      # The account's artifact storage can be full (the billing lock also stops the
      # quota from being freed), and the re-anchor below runs in this same job,
      # so the record is also kept on the runner. Keyed by this run and attempt,
      # never by commit: a re-run of a commit whose verify failed must not find
      # the record an earlier green run left behind.
      - name: Keep the measurement on the runner for the re-anchor
        if: steps.guard.outputs.measure_needed == 'true'
        run: |
          mkdir -p "$HOME/.accordo-ci/measurements"
          cp "$RUNNER_TEMP/measurement.json" "$HOME/.accordo-ci/measurements/${{ github.run_id }}-${{ github.run_attempt }}.json"
      - name: Smoke the measured tree
        if: steps.guard.outputs.measure_needed == 'true'
        run: scripts/ci-heavy.sh smoke -- npm run smoke
      - name: Replay the published quote approval recipe
        if: steps.guard.outputs.measure_needed == 'true'
        run: |
          scripts/ci-heavy.sh recipe -- bash -c 'node --no-warnings examples/recipes/quote-approval/run.mjs "$RUNNER_TEMP/quote-approval-crm" && npm --prefix "$RUNNER_TEMP/quote-approval-crm" run verify'
      - uses: actions/upload-artifact@v4
        # Best effort: the runner-local copy above is what the re-anchor falls back to.
        if: steps.guard.outputs.measure_needed == 'true'
        continue-on-error: true
        with:
          name: claims-measurement-${{ github.sha }}
          path: ${{ runner.temp }}/measurement.json
          if-no-files-found: error
          retention-days: 30
      # What `public-claims` used to do on every push now happens here, once per
      # window, on the tree just measured: the committed truth document must
      # equal a fresh generation from its own inputs (same leniency as on PRs —
      # advisory-only drift warns instead of failing), then the ledger is
      # re-anchored at this run's measurement, the document regenerated, and
      # freshness (`--require-current`) proves the new numbers. A missing or
      # failed measurement fails red here instead of passing quietly.
      - name: The committed truth document agrees with its authorities
        if: steps.guard.outputs.measure_needed == 'true'
        run: npm run repo:truth -- --check --drift-advisory
      - name: Re-anchor the ledger at this run's measurement
        if: steps.guard.outputs.measure_needed == 'true'
        run: node scripts/apply-ci-measurement.js "${{ runner.temp }}/measurement.json"
      - name: Regenerate the truth document from the re-anchored ledger
        if: steps.guard.outputs.measure_needed == 'true'
        run: npm run repo:truth
      - name: Freshness holds on the fresh measurement
        if: steps.guard.outputs.measure_needed == 'true'
        run: npm run repo:truth -- --check --require-current
      # Controlled regeneration (backlog:6a3d0316): when merges since the last
      # measurement carried advisory-only drift, the regenerated files above go
      # onto the fixed branch `chore/truth-realign-main` behind ONE PR titled
      # `chore(truth): realign main`, which follows the normal gate, so `main`
      # returns aligned with no manual commit and CI never pushes to `main`
      # directly. (Moved here from `public-claims` with the measurement.)
      - name: Realign the committed truth document when merges drifted
        if: steps.guard.outputs.measure_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/realign-truth-main.js --push
      # The durable half of the head-changed guard: record this checkout head
      # as successfully measured, outside the checkout, on the single runner.
      # The last step on purpose, after every green-or-red measure step (none
      # has `continue-on-error`): a failed measurement — or a failed realign
      # above — never marks its head, so the next window measures it again. A
      # recording failure only warns: it must not redden a green measurement.
      - name: Record the measured head for the schedule guard
        if: steps.guard.outputs.measure_needed == 'true'
        run: node scripts/ci-measure-guard.js --record --state-file "$HOME/.accordo-ci/main-last-measurement.json"

  # Public claims are held to the same standard as the code that backs them:
  # a marketing sentence whose evidence has moved fails the build, exactly like a
  # test would. See scripts/site-check.js and scripts/distribution-check.js.
  public-claims:
    # Same billing-lock routing as `verify` above.
    runs-on: [self-hosted, accordo-ci]
    # A push to `main` proves agreement and reports the measurement's age, and
    # stays green between a merge and the next scheduled measurement
    # (backlog:911355123044): no local `measure-suite --apply` commit is
    # needed for a PR to go green (backlog:98cb04b959e6), and the merged tree
    # is re-measured on schedule by `verify`, not at merge time here. The
    # re-anchor, the freshness gate (`--require-current`) and the realign PR
    # moved to `verify` with the measurement; this job never starts
    # `measure-suite.js` and never fails for a stale-but-agreeing ledger.
    # Its own lane: a newer push supersedes this check, and it never cancels
    # — nor waits on — a scheduled measurement already running.
    concurrency:
      group: ci-main-claims
      cancel-in-progress: true
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A job that reads history, because it checks a historical fact.
          # site/claims.json records the commit its public numbers were
          # measured at, and scripts/measurement.js has to show that commit is an
          # ancestor of HEAD — object existence is not provenance; a commit pushed to an
          # unrelated branch has that too.
          #
          # `git merge-base --is-ancestor` needs the commits *between* the two, not just
          # the named one, so a targeted `git fetch origin <sha>` does not help: it hands
          # back an object with no path to HEAD and the check still cannot answer. Full
          # history is the smallest thing that answers the question, and it is cheap here
          # — the pack is under 3 MB.
          #
          # Without this, the default fetch-depth: 1 leaves no commit but HEAD, and every
          # honest historical measurement is reported as "not a commit in this
          # repository". That is what was failing PRs #43, #44 and #45. Removing it does
          # not silently re-break them: the gate now recognises a shallow clone and fails
          # with "history unavailable" instead.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run gtm:check
      # The Repository Truth Contract (ADR-039) agreement gate belongs in this
      # job and in `fast`, never the freshness gate: its measurement
      # provenance checks need full git history, and this job has it. The
      # freshness gate (`--require-current`) runs in the scheduled `verify`
      # flow, which also checks out full history since the re-anchor moved
      # there with the measurement.
      #
      # It shipped wired into nothing: a contract written because the failure it
      # closes was "found by a person, not by a gate" was itself waiting on a
      # person to remember to type the command. A separate step rather than a
      # member of `gtm:check`, so the composition of `gtm:check` — which a
      # developer runs locally in a possibly shallow clone — is unchanged. It
      # takes about half a second.
      #
      # Gate 1 on the committed document: the document the merge commits must
      # equal a fresh generation from its own inputs — with the same leniency
      # as on PRs (S70, backlog:6a3d0316): advisory-only drift warns instead
      # of failing. A moved or dropped value still fails here. Measurement
      # staleness does NOT fail here: between a merge and the next scheduled
      # measurement the ledger names the older tree by design, and freshness
      # (`--require-current`) runs in the scheduled `verify` flow instead.
      # Every non-measurement fact stays the author's to regenerate.
      - name: The committed truth document agrees with its authorities
        run: npm run repo:truth -- --check --drift-advisory
      # Signal, never gate: reports which tree the public numbers were
      # measured at and how old that measurement is — a `::notice::` inside
      # the measure window, a `::warning::` past it. The age counts from when
      # the scheduled run took the measurement (its runner-local record),
      # not from the measured commit's date. Always exits 0, so this job
      # stays green between a merge and the next scheduled measurement.
      - name: Report the measurement age
        run: node scripts/ci-measurement-age.js --window-hours 24 --state-file "$HOME/.accordo-ci/main-last-measurement.json"
