# Backoffice screenshots for visual review (BO-F6-02, backlog:c8364e59).
#
# What it does: on every PR that touches the /bo static assets or the shots
# script, it renders every backoffice screen at 1440px and 390px with
# `npm run bo:shots` and uploads the PNGs as the `bo-shots` artifact, so a
# reviewer can compare each changed screen against the approved prototype
# without painting locally. This workflow is review evidence only: it never
# blocks the merge gate (see `ci.yml`, job `fast`).
#
# Where it runs: the self-hosted accordo-ci Mac runner, the only runner with
# a working Chromium (the billing lock rejects GitHub-hosted jobs for this
# account). On sandbox-less Linux the script retries Chromium with
# --no-sandbox (backlog:cd0ad69b); when no runnable Chromium exists at all
# the render fails loudly (exit 1) instead of skipping in silence. A green
# run always carries PNGs (backlog:cd0ad69b: from 2026-11-10 13:19Z to
# 2026-11-11 04:49Z this job was green with no screenshot and no artifact,
# and design checks trusted it). The evidence lives on the runner's own
# disk, ~/accordo-shots/<sha40>/ (ACCORDO_SHOTS_DIR), because the account
# artifact quota stays full behind the billing lock: the store step copies
# PNGs and manifest there atomically, prunes folders older than 7 days and
# fails the job on 0 PNGs or no manifest. The artifact upload is an extra.

name: bo-shots

on:
  pull_request:
    paths:
      - 'apps/admin/public/**'
      - 'scripts/bo-shots.js'
      - '.github/workflows/bo-shots.yml'
  # Manual evidence renders (BO-F6-02, backlog:c8364e59): the upload step is
  # lossy while the account artifact quota is full, so a reviewer can
  # re-render the PNGs on demand with `gh workflow run bo-shots.yml`.
  workflow_dispatch:

# One run per PR, always the newest; a superseded run is cancelled.
concurrency:
  group: bo-shots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    # Self-hosted while the account billing lock rejects every GitHub-hosted
    # job at start (0 steps, "account is locked due to a billing issue").
    runs-on: [self-hosted, accordo-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # No `npm ci`: scripts/bo-shots.js uses node builtins only, so the
      # render needs no install and no machine lock beyond the runner queue.
      - name: Render every /bo screen at 1440px and 390px
        run: node scripts/bo-shots.js --out "${RUNNER_TEMP}/bo-shots"
      # The server folder is the evidence (backlog:cd0ad69b): the artifact
      # quota stays full behind the billing lock, so the PNGs land on the
      # self-hosted runner's disk, one folder per head SHA, written to a temp
      # folder and moved into place so a reader never sees half a set.
      # Folders older than 7 days are pruned. 0 PNGs or no manifest is red.
      - name: Store the PNGs on the server (zero PNGs fails the job)
        env:
          SHOTS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/bo-shots"
          base="${ACCORDO_SHOTS_DIR:-$HOME/accordo-shots}"
          sha="${SHOTS_SHA}"
          case "$sha" in
            *[!0-9a-f]*|'') echo "::error::bo:shots: bad commit sha '$sha'"; exit 1 ;;
          esac
          if [ "${#sha}" -ne 40 ]; then echo "::error::bo:shots: sha '$sha' is not 40 hex chars"; exit 1; fi
          mkdir -p "$base"
          dest="$base/$sha"
          tmp="$base/.tmp-$sha-$$"
          rm -rf "$tmp"
          mkdir "$tmp"
          if [ -d "$src" ]; then
            find "$src" -maxdepth 1 -type f \( -name '*.png' -o -name 'manifest.json' \) -exec cp {} "$tmp/" \;
          fi
          rm -rf "$dest.old"
          if [ -d "$dest" ]; then mv "$dest" "$dest.old"; fi
          mv "$tmp" "$dest"
          rm -rf "$dest.old"
          find "$base" -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} +
          count=$(find "$dest" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::bo:shots produced 0 PNGs in $dest: a green shots job must carry screenshots"
            exit 1
          fi
          if [ ! -f "$dest/manifest.json" ]; then
            echo "::error::bo:shots left no manifest.json in $dest"
            exit 1
          fi
          echo "bo:shots stored $count PNG(s) in $dest"
      # Extra only: the account artifact quota is full behind the billing
      # lock, so the upload may fail without turning the job red. The proof
      # is the server folder above.
      - name: Upload the PNGs for visual review
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: bo-shots
          path: ${{ runner.temp }}/bo-shots/
          if-no-files-found: warn
          retention-days: 3
