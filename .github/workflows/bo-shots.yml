# Backoffice screenshots for visual review (BO-F6-02, backlog:c8364e59).
#
# What it does: on every PR that touches the /bo static assets or the shots
# script, it renders every backoffice screen at 1440px and 390px with
# `npm run bo:shots` and uploads the PNGs as the `bo-shots` artifact, so a
# reviewer can compare each changed screen against the approved prototype
# without painting locally. This workflow is review evidence only: it never
# blocks the merge gate (see `ci.yml`, job `fast`).
#
# Where it runs: the self-hosted accordo-ci Mac runner, the only runner with
# a working Chromium (the billing lock rejects GitHub-hosted jobs for this
# account, and sandboxes refuse Chromium's Mach bootstrap, so the script
# skips cleanly anywhere else). When no runnable Chromium exists the render
# exits 0 with a skip message and the upload warns instead of failing.

name: bo-shots

on:
  pull_request:
    paths:
      - 'apps/admin/public/**'
      - 'scripts/bo-shots.js'
      - '.github/workflows/bo-shots.yml'
  # Manual evidence renders (BO-F6-02, backlog:c8364e59): the upload step is
  # lossy while the account artifact quota is full, so a reviewer can
  # re-render the PNGs on demand with `gh workflow run bo-shots.yml`.
  workflow_dispatch:

# One run per PR, always the newest; a superseded run is cancelled.
concurrency:
  group: bo-shots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    # Self-hosted while the account billing lock rejects every GitHub-hosted
    # job at start (0 steps, "account is locked due to a billing issue").
    runs-on: [self-hosted, accordo-ci]
    timeout-minutes: 20
    # One-off (BO-F6-05, backlog:5acdfd87): the account artifact quota is
    # full, so a manual dispatch commits the fresh login pair straight to
    # the branch instead of uploading an artifact. Reverted before merge.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # No `npm ci`: scripts/bo-shots.js uses node builtins only, so the
      # render needs no install and no machine lock beyond the runner queue.
      - name: Render every /bo screen at 1440px and 390px
        run: node scripts/bo-shots.js --out "${RUNNER_TEMP}/bo-shots"
      # continue-on-error: the account artifact quota fills up every 6-12 h
      # and a full quota must not turn the shots job red (review evidence
      # only); the PNGs are regenerated by bo:shots on every run anyway.
      - name: Upload the PNGs for visual review
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: bo-shots
          path: ${{ runner.temp }}/bo-shots/
          if-no-files-found: warn
          retention-days: 3
      # One-off commit-back (BO-F6-05, backlog:5acdfd87): manual dispatch
      # only. Copies the fresh login pair into the proof fixtures and
      # pushes to the dispatched branch. Reverted before merge.
      - name: Commit fresh login PNGs to the branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          git config user.name "accordo-ci"
          git config user.email "accordo-ci@example.invalid"
          git fetch origin "${{ github.ref_name }}"
          git checkout "${{ github.ref_name }}"
          mkdir -p tests/fixtures/bo-shots-proof
          cp "${RUNNER_TEMP}/bo-shots/login-1440x1800.png" tests/fixtures/bo-shots-proof/login-1440x1800.png
          cp "${RUNNER_TEMP}/bo-shots/login-390x1600.png" tests/fixtures/bo-shots-proof/login-390x1600.png
          git add tests/fixtures/bo-shots-proof/login-1440x1800.png tests/fixtures/bo-shots-proof/login-390x1600.png
          git diff --cached --quiet && echo "login PNGs unchanged" || (git commit -m "backlog:5acdfd87 fresh login proof PNGs from CI bo-shots" && git push origin "HEAD:${{ github.ref_name }}")
