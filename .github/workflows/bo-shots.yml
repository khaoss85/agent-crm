# Backoffice screenshots for visual review (BO-F6-02, backlog:c8364e59).
#
# What it does: on demand (label «shots» on a PR, or workflow_dispatch), it renders every backoffice screen at 1440px and 390px with
# `npm run bo:shots` and uploads the PNGs as the `bo-shots` artifact, so a
# reviewer can compare each changed screen against the approved prototype
# without painting locally. This workflow is review evidence only: it never
# blocks the merge gate (see `ci.yml`, job `fast`).
#
# Where it runs: the self-hosted accordo-ci Mac runner, the only runner with
# a working Chromium (the billing lock rejects GitHub-hosted jobs for this
# account). On sandbox-less Linux the script retries Chromium with
# --no-sandbox (backlog:cd0ad69b); when no runnable Chromium exists at all
# the render fails loudly (exit 1) instead of skipping in silence, and the
# upload warns instead of failing.

name: bo-shots

# On demand only (13/11, supervisor with the Leader's ok): add the label «shots»
# to a PR, or `gh workflow run bo-shots.yml`. It used to run on every push of a
# PR touching apps/admin/public/**: 60 runs in 24 h of 2.5-4 min each on the 2
# self-hosted runners (about 3 runner hours a day, one run out of two per push
# of an interface PR), while it is not a required check, its artifacts were not
# uploaded (account quota full) so nobody could look at them, and it found no
# defect. Design checks stay as they are: local shots of the exact head.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

# One run per PR, always the newest; a superseded run is cancelled.
concurrency:
  group: bo-shots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'shots'
    # Self-hosted while the account billing lock rejects every GitHub-hosted
    # job at start (0 steps, "account is locked due to a billing issue").
    runs-on: [self-hosted, accordo-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # No `npm ci`: scripts/bo-shots.js uses node builtins only, so the
      # render needs no install and no machine lock beyond the runner queue.
      - name: Render every /bo screen at 1440px and 390px
        run: node scripts/bo-shots.js --out "${RUNNER_TEMP}/bo-shots"
      # continue-on-error: the account artifact quota fills up every 6-12 h
      # and a full quota must not turn the shots job red (review evidence
      # only); the PNGs are regenerated by bo:shots on every run anyway.
      - name: Upload the PNGs for visual review
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: bo-shots
          path: ${{ runner.temp }}/bo-shots/
          if-no-files-found: warn
          retention-days: 3
