# Backoffice screenshots for visual review (BO-F6-02, backlog:c8364e59).
#
# What it does: on every PR that touches the /bo static assets or the shots
# script, it renders every backoffice screen at 1440px and 390px with
# `npm run bo:shots` and uploads the PNGs as the `bo-shots` artifact, so a
# reviewer can compare each changed screen against the approved prototype
# without painting locally. This workflow is review evidence only: it never
# blocks the merge gate (see `ci.yml`, job `fast`).
#
# Where it runs: the self-hosted accordo-ci Mac runner, the only runner with
# a working Chromium (the billing lock rejects GitHub-hosted jobs for this
# account). On sandbox-less Linux the script retries Chromium with
# --no-sandbox (backlog:cd0ad69b); when no runnable Chromium exists at all
# the render fails loudly (exit 1) instead of skipping in silence. A green
# run always carries PNGs: the count step fails the job on zero PNGs and the
# upload fails the job when the artifact does not land (backlog:cd0ad69b:
# from 2026-11-10 13:19Z to 2026-11-11 04:49Z this job was green with no
# screenshot and no artifact, and design checks trusted it).

name: bo-shots

on:
  pull_request:
    paths:
      - 'apps/admin/public/**'
      - 'scripts/bo-shots.js'
      - '.github/workflows/bo-shots.yml'
  # Manual evidence renders (BO-F6-02, backlog:c8364e59): the upload step is
  # lossy while the account artifact quota is full, so a reviewer can
  # re-render the PNGs on demand with `gh workflow run bo-shots.yml`.
  workflow_dispatch:

# One run per PR, always the newest; a superseded run is cancelled.
concurrency:
  group: bo-shots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    # Self-hosted while the account billing lock rejects every GitHub-hosted
    # job at start (0 steps, "account is locked due to a billing issue").
    runs-on: [self-hosted, accordo-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # No `npm ci`: scripts/bo-shots.js uses node builtins only, so the
      # render needs no install and no machine lock beyond the runner queue.
      - name: Render every /bo screen at 1440px and 390px
        run: node scripts/bo-shots.js --out "${RUNNER_TEMP}/bo-shots"
      # Zero PNGs is never a pass (backlog:cd0ad69b): the render must leave
      # its manifest and at least one PNG, otherwise the job goes red here.
      - name: Count the PNGs (zero PNGs fails the job)
        run: |
          dir="${RUNNER_TEMP}/bo-shots"
          count=$(find "$dir" -maxdepth 1 -type f -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::bo:shots produced 0 PNGs in $dir: a green shots job must carry screenshots"
            exit 1
          fi
          if [ ! -f "$dir/manifest.json" ]; then
            echo "::error::bo:shots left no manifest.json in $dir"
            exit 1
          fi
          echo "bo:shots produced $count PNG(s)"
      # No continue-on-error (backlog:cd0ad69b): a run whose artifact did not
      # upload (quota full included) is red, so nobody reads a green job as
      # visual evidence that does not exist. Re-run once the quota frees up.
      - name: Upload the PNGs for visual review
        uses: actions/upload-artifact@v4
        with:
          name: bo-shots
          path: ${{ runner.temp }}/bo-shots/
          if-no-files-found: error
          retention-days: 3
