name: Nightly tool-selection matrix

# The full worktree-heavy cartesian product behind ACCORDO_FULL_TOOL_SELECTION:
# tests/agent-tool-selection-scoring.test.js runs its fast scoring, contract and
# receipt tests on every CI run and skips the 21 worktree-heavy cells unless the
# variable is set. This job sets it, so the whole matrix still runs daily, off
# peak, on the same self-hosted runner — coverage is moved, not removed.
# Two launchers, one run a night (owner GO 13/11: one run a night after 01:17Z, idempotent, no double with the
# GitHub event). The server launcher (accordo-night round -> nightly-matrix.sh, outside this repo) dispatches at
# 01:17Z unless a run of that night exists. The GitHub schedule stays as the in-repo fallback: a scheduled run
# skips when it starts outside 00:00-04:59 UTC (it came ~7 h late every day 10-13/11) or when another run of
# this workflow was already created this UTC night, so the two never run twice.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: nightly-tool-selection
  cancel-in-progress: false

jobs:
  full-matrix:
    runs-on: [self-hosted, accordo-ci]
    env:
      ACCORDO_FULL_TOOL_SELECTION: '1'
    steps:
      # Late or duplicate scheduled runs stop in seconds instead of holding a runner, concluding «cancelled»
      # (never «success»); the supervisor round reports a night without a successful run as NOT DONE.
      # A manual dispatch always runs.
      - id: window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$((10#$(date -u +%H)))
          run=true
          if [ "${{ github.event_name }}" = schedule ]; then
            if [ "$h" -ge 5 ]; then
              run=false; echo "::warning::nightly matrix skipped: scheduled run started at ${h}h UTC, outside 00-04"
            else
              others=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly-tool-selection.yml/runs?created=>=$(date -u +%F)T00:00:00Z&per_page=20" \
                --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion != \"cancelled\" and .conclusion != \"failure\")] | length") || others=0
              if [ "${others:-0}" -gt 0 ]; then run=false; echo "::notice::nightly matrix already launched tonight ($others other run(s)); this scheduled run skips"; fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          # A skipped night must never read as a passing one: the run cancels itself, so its conclusion is
          # «cancelled», not «success»; only a run that executed the matrix can conclude success.
          if [ "$run" = false ]; then gh run cancel ${{ github.run_id }} -R ${{ github.repository }}; sleep 60; exit 1; fi
      - if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - if: steps.window.outputs.run == 'true'
        run: npm ci
      - if: steps.window.outputs.run == 'true'
        run: scripts/ci-heavy.sh nightly-scoring -- node --no-warnings --test tests/agent-tool-selection-scoring.test.js
