name: Nightly tool-selection matrix

# The full worktree-heavy cartesian product behind ACCORDO_FULL_TOOL_SELECTION:
# tests/agent-tool-selection-scoring.test.js runs its fast scoring, contract and
# receipt tests on every CI run and skips the 21 worktree-heavy cells unless the
# variable is set. This job sets it, so the whole matrix still runs daily, off
# peak, on the same self-hosted runner — coverage is moved, not removed.
# Launched once a night (01:17-04:59Z) by the Accordo supervisor on the server: the systemd user timer
# accordo-night runs night-supervisor.sh every 600 s, which calls nightly-matrix.sh run (owner GO 13/11). The
# launcher lives outside this repo, in the supervisor tools on the CI server
# (~/dev/_handoff/accordo-minimal-supervisor/tools/nightly-matrix.sh). It dispatches at most once a night and only when no run of that night exists; a
# night with no successful run is reported as NOT DONE in the supervisor round. The GitHub schedule fired ~7 h
# late every day (10-13/11) and could run twice next to it, so it is removed here. Keeping the launcher outside
# this repo is the owner decision of 13/11 (GO to the supervisor: reuse the existing accordo-night round, no
# in-repo trigger, no double run); the window guard of #855 is gone with the schedule it guarded.
on:
  workflow_dispatch:

concurrency:
  group: nightly-tool-selection
  cancel-in-progress: false

jobs:
  full-matrix:
    runs-on: [self-hosted, accordo-ci]
    env:
      ACCORDO_FULL_TOOL_SELECTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: scripts/ci-heavy.sh nightly-scoring -- node --no-warnings --test tests/agent-tool-selection-scoring.test.js
