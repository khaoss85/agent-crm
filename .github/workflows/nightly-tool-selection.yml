name: Nightly tool-selection matrix

# The full worktree-heavy cartesian product behind ACCORDO_FULL_TOOL_SELECTION:
# tests/agent-tool-selection-scoring.test.js runs its fast scoring, contract and
# receipt tests on every CI run and skips the 21 worktree-heavy cells unless the
# variable is set. This job sets it, so the whole matrix still runs daily, off
# peak, on the same self-hosted runner — coverage is moved, not removed.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-tool-selection
  cancel-in-progress: false

jobs:
  full-matrix:
    runs-on: [self-hosted, accordo-ci]
    env:
      ACCORDO_FULL_TOOL_SELECTION: '1'
    steps:
      # GitHub can fire a scheduled run hours late when the runners are busy (13/11: the 01:17 schedule
      # started at 07:57Z and held one of the two runners during the morning PR rush). A scheduled run
      # that starts outside the night window (00:00-05:59 UTC) skips the matrix in seconds instead of
      # holding a runner; the next night runs it. A manual workflow_dispatch always runs.
      - id: window
        run: |
          h=$(date -u +%H)
          if [ "${{ github.event_name }}" = schedule ] && [ "$h" -ge 6 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "nightly matrix skipped: scheduled run started at ${h}h UTC, outside 00-05"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - if: steps.window.outputs.run == 'true'
        run: npm ci
      - if: steps.window.outputs.run == 'true'
        run: scripts/ci-heavy.sh nightly-scoring -- node --no-warnings --test tests/agent-tool-selection-scoring.test.js
